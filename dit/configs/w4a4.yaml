model:
  model_id: dit
  model_type: dit
calib_data:
  save_path: ../../calib_data.pth
remain_fp_regex: "t_embedder|adaLN_modulation|final_layer"  
jdus:
  alpha: 0.5
  svd_threshold: 1e-3
  epsilon_threshold: 1e-5
  layer_name_regex: attn|mlp
weight:
  n_bits: 4
  group: tensor
  sym: false
  group_size: 128
  gptq: True
  gptq_config:
    sym: False
    mse: True
act:
  n_bits: 4
  group: tensor
  sym: false
  group_size: 128
calib_batch_size: 50