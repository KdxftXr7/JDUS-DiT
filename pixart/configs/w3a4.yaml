model:
  model_id: pixart_sigma
remain_fp_regex: pos_embed|norm_out|adaln_single|caption_projection|proj_out
calib_data:
  save_path: ../../calib_data.pth
jdus:
  alpha: 0.61
  svd_threshold: 1e-3
  epsilon_threshold: 1e-5
  layer_name_regex: ff.net|attn
weight:
  n_bits: 3
  sym: false
  group_size: 128
  gptq: True
  gptq_config:
    sym: False
    mse: True
act:
  n_bits: 4
  sym: false
  group_size: 128
calib_batch_size: 8